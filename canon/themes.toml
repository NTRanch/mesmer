    "subliminal affirmation layer, SSB-AM encoded, -18 dB below the bed, fully listed in this disclosure",
    "first-person and second-person affirmation sets, listed in full in the delivery payload",
    "one anchor (cue: 'settle now') registered with its removal procedure",
    "programme framing: effect accumulates with each scheduled listen, inside the grant's expiry and cadence caps",
]
never_for_driving = true
stop_cue_required = true

[[pack.affirmation_sets]]
